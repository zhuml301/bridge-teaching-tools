  <h3 style="margin-top:14px">选中文字格式</h3>
  <div class="cv-fmt-tip">选中文字 → 即改所选；不选 → 对后续输入生效</div>
  <div class="cv-fmt-row">
    <span>字号</span>
    <input type="number" id="fSize" min="10" max="96" step="1" value="54"> px
  </div>
  <div class="cv-fmt-row">
    <span>字距</span>
    <input type="number" id="fSpace" min="-2" max="16" step="0.5" value="3"> px
  </div>
  <div class="cv-fmt-row">
    <span>字体</span>
    <select id="fFont" style="flex:1">
      <option value="">（跟随页面默认）</option>
      <option value="'Microsoft YaHei',sans-serif">微软雅黑</option>
      <option value="'KaiTi','STKaiti',serif">楷体</option>
      <option value="'SimSun',serif">宋体</option>
      <option value="'SimHei',sans-serif">黑体</option>
      <option value="'FangSong',serif">仿宋</option>
      <option value="'Segoe UI',sans-serif">西文 Segoe UI</option>
    </select>
  </div>
  <div class="cv-fmt-row">
    <span>行距</span>
    <input type="number" id="fLine" min="1" max="2.4" step="0.05" value="1.35"> 倍
  </div>
  <div class="cv-fmt-row cv-swatches">
    <span>颜色</span>
    <span class="cv-sw" data-c="#FFFFFF" style="background:#FFFFFF"></span>
    <span class="cv-sw" data-c="#8FCEC0" style="background:#8FCEC0"></span>
    <span class="cv-sw" data-c="#C9EFE4" style="background:#C9EFE4"></span>
    <span class="cv-sw" data-c="#EAD9A8" style="background:#EAD9A8"></span>
    <span class="cv-sw" data-c="#E8927C" style="background:#E8927C"></span>
    <span class="cv-sw" data-c="#6FA8DC" style="background:#6FA8DC" title="蓝色"></span>
    <span class="cv-sw" data-c="#A9CFF5" style="background:#A9CFF5" title="浅蓝色"></span>
    <input type="color" id="fColor" value="#8FCEC0" title="自定义颜色">
  </div>
  <div class="cv-fmt-state" id="fState">未选中文字</div>
</div>
<label>背景压暗强度 <span id="vDim">100</span>%</label>
  <input type="range" id="rDim" min="30" max="130" value="100">
  <div class="row">
    <button id="cvBtnReset" class="ghost">恢复默认</button>
    <button id="cvBtnHide">收起面板</button>
  </div>
  <div style="margin-top:10px;font-size:11px;color:#7FA8A1">修改自动保存在本机；「导出HTML」生成可带走的封面文件。</div>
</div>
<script>
(function(){
const $=id=>document.getElementById(id);
const LSK='yq_cover_v1';
const DEF={title:54,brand:25,color:'teal',dim:100};
const PALETTES={
  teal:{title:'#8FCEC0',sub:'#7CBCAF',brand:'#8FC9BD'},
  pale:{title:'#C9EFE4',sub:'#A9DCD0',brand:'#B9E2DA'},
  white:{title:'#FFFFFF',sub:'#E6F2EE',brand:'#E6F5F0'},
  gold:{title:'#EAD9A8',sub:'#D8C48C',brand:'#E3D3A2'}
};
let S=Object.assign({},DEF);
S.pos={body:{x:20,y:47},lockup:{x:6.5,y:7},meta:{x:20,y:88}};
function apply(){
  $('cvTitle').style.fontSize=S.title+'px';
  $('cvBrand').style.fontSize=S.brand+'px';
  const pal=PALETTES[S.color]||PALETTES.teal;
  $('cvTitle').style.color=pal.title;
  ['cvLesson','cvSub','cvMeta'].forEach(id=>$(id).style.color=pal.sub);
  $('cvBrand').style.color=pal.brand;
  $('cvGrad').style.opacity=S.dim/100;
  applyPos();
  $('vTitle').textContent=S.title;$('vBrand').textContent=S.brand;$('vDim').textContent=S.dim;
  $('rTitle').value=S.title;$('rBrand').value=S.brand;$('rDim').value=S.dim;$('cColor').value=S.color;
}
const POS_EL={body:'cvBody',lockup:'cvLockup',meta:'cvMeta'};
// 容器id：cv-body/cv-lockup/cv-meta（meta 原用 bottom 定位，调整时改 top）
const POS_ID={body:'cv-body',lockup:'cv-lockup',meta:'cv-meta'};
function applyPos(){
  for(const k of ['body','lockup','meta']){
    const el=document.querySelector('.'+POS_ID[k]);if(!el)continue;
    const p=S.pos[k];if(!p)continue;
    el.style.left=p.x+'%';
    el.style.top=p.y+'%';
    if(k==='meta')el.style.bottom='auto';
  }
}
function showPos(){
  const k=$('pTarget').value,p=S.pos[k];
  $('pX').value=p.x;$('pY').value=p.y;
  $('vX').textContent=p.x+'%';$('vY').textContent=p.y+'%';
}
function save(){try{localStorage.setItem(LSK,JSON.stringify(S))}catch(e){}}
try{const sv=JSON.parse(localStorage.getItem(LSK)||'null');if(sv)S=Object.assign(S,sv);}catch(e){}
// 恢复上次编辑的文字
try{const txt=JSON.parse(localStorage.getItem(LSK+'_text')||'null');
  if(txt)for(const id of ['cvBrand','cvEn','cvLesson','cvTitle','cvSub','cvMeta','cvFoot'])
    if(txt[id]!=null)$(id).innerHTML=txt[id];
}catch(e){}
function saveText(){try{const t={};for(const id of ['cvBrand','cvEn','cvLesson','cvTitle','cvSub','cvMeta','cvFoot'])
  t[id]=$(id).innerHTML;localStorage.setItem(LSK+'_text',JSON.stringify(t));}catch(e){}}
document.querySelectorAll('[contenteditable]').forEach(el=>el.addEventListener('input',saveText));
apply();
// 首次使用自动展开工具面板（只有用户主动收起过才不再自动展开）
try{if(!localStorage.getItem('yq_cover_panel_closed'))$('cvPanel').classList.add('on');}catch(e){}
$('pTarget').addEventListener('change',showPos);
$('pX').addEventListener('input',e=>{const k=$('pTarget').value;S.pos[k].x=+e.target.value;applyPos();showPos();save();});
$('pY').addEventListener('input',e=>{const k=$('pTarget').value;S.pos[k].y=+e.target.value;applyPos();showPos();save();});
showPos();
$('rTitle').oninput=e=>{S.title=+e.target.value;apply();save();};
$('rBrand').oninput=e=>{S.brand=+e.target.value;apply();save();};
$('rDim').oninput=e=>{S.dim=+e.target.value;apply();save();};
$('cColor').onchange=e=>{S.color=e.target.value;apply();save();};
/* ── Alt+拖动自由移动文字区（与打字/选字不冲突） ── */
(function(){
  const MAP={'cv-body':'body','cv-lockup':'lockup','cv-meta':'meta'};
  for(const cls of Object.keys(MAP)){
    const el=document.querySelector('.'+cls);if(!el)continue;
    el.addEventListener('mousedown',e=>{
      if(!e.altKey)return;
      e.preventDefault();e.stopPropagation();
      const key=MAP[cls];
      const wrap=document.querySelector('.cv-wrap').getBoundingClientRect();
      const sx=e.clientX,sy=e.clientY,ox=S.pos[key].x,oy=S.pos[key].y;
      $('pTarget').value=key;showPos();
      const move=ev=>{
        S.pos[key].x=Math.max(0,Math.min(85,+(ox+(ev.clientX-sx)/wrap.width*100).toFixed(1)));
        S.pos[key].y=Math.max(0,Math.min(95,+(oy+(ev.clientY-sy)/wrap.height*100).toFixed(1)));
        applyPos();showPos();
      };
      const up=()=>{document.removeEventListener('mousemove',move);document.removeEventListener('mouseup',up);save();};
      document.addEventListener('mousemove',move);document.addEventListener('mouseup',up);
    },true);
  }
})();
/* ── 选中文字格式：选区/后续输入双模式 ── */
let savedRange=null,pend={};
const inEditable=node=>{
  if(!node)return null;
  let n=node.nodeType===3?node.parentElement:node;
  while(n){if(n.isContentEditable)return n;n=n.parentElement;}
  return null;
};
document.addEventListener('selectionchange',()=>{
  const sel=window.getSelection();
  if(!sel.rangeCount)return;
  const r=sel.getRangeAt(0);
  if(!inEditable(r.commonAncestorContainer))return;
  savedRange=r.cloneRange();
  const ed=inEditable(r.commonAncestorContainer);
  // 回显当前位置格式
  const host=r.startContainer.nodeType===3?r.startContainer.parentElement:r.startContainer;
  const cs=getComputedStyle(host);
  const fs=parseFloat(cs.fontSize);if(fs)$('fSize').value=Math.round(fs);
  const ls=parseFloat(cs.letterSpacing);$('fSpace').value=isNaN(ls)?0:ls;
  $('fState').textContent=sel.isCollapsed?'光标在「'+(ed.id||'')+'」· 后续输入生效':'已选中「'+(ed.id||'')+'」的部分文字';
});
// 控件按下不抢焦点/选区
['fSize','fSpace','fColor'].forEach(id=>$(id).addEventListener('mousedown',e=>{/* number/color 需要焦点，允许 */}));
function applyToSelection(prop,val){
  const sel=window.getSelection();
  const r=(sel.rangeCount&&!sel.isCollapsed&&inEditable(sel.getRangeAt(0).commonAncestorContainer))
    ?sel.getRangeAt(0):(savedRange&&!savedRange.collapsed?savedRange:null);
  if(!r)return false;
  const span=document.createElement('span');
  span.style[prop]=val;
  try{
    const frag=r.extractContents();
    span.appendChild(frag);
    r.insertNode(span);
  }catch(e){return false;}
  // 选区留在新内容上，方便连续改
  const ns=window.getSelection();ns.removeAllRanges();
  const nr=document.createRange();nr.selectNodeContents(span);ns.addRange(nr);
  savedRange=nr.cloneRange();
  saveText();
  return true;
}
function applyFmt(prop,val){
  pend[prop]=val;
  if(applyToSelection(prop,val)){
    $('fState').textContent='已应用到所选文字';
  }else{
    $('fState').textContent='未选中 · 后续输入将带此格式';
  }
}
$('fSize').addEventListener('input',e=>{
  const v=Math.max(10,Math.min(96,parseFloat(e.target.value)||54));
  applyFmt('fontSize',v+'px');
});
$('fSpace').addEventListener('input',e=>{
  const v=Math.max(-2,Math.min(16,parseFloat(e.target.value)||0));
  applyFmt('letterSpacing',v+'px');
});
$('fLine').addEventListener('input',e=>{
  const v=Math.max(1,Math.min(2.4,parseFloat(e.target.value)||1.35));
  applyFmt('lineHeight',String(v));
});
$('fColor').addEventListener('input',e=>applyFmt('color',e.target.value));
$('fFont').addEventListener('change',e=>{if(e.target.value)applyFmt('fontFamily',e.target.value);});
document.querySelectorAll('.cv-sw').forEach(sw=>sw.addEventListener('click',()=>{
  $('fColor').value=sw.dataset.c;applyFmt('color',sw.dataset.c);
}));
// 后续输入：在 contenteditable 里插入带格式的文字
document.querySelectorAll('[contenteditable]').forEach(ed=>{
  ed.addEventListener('beforeinput',e=>{
    if(e.inputType!=='insertText'||!e.data)return;
    if(!pend.fontSize&&!pend.color&&!pend.letterSpacing)return;
    const sel=window.getSelection();
    if(!sel.rangeCount||!sel.isCollapsed)return;
    e.preventDefault();
    const st=[];if(pend.fontSize)st.push('font-size:'+pend.fontSize);
    if(pend.color)st.push('color:'+pend.color);
    if(pend.letterSpacing)st.push('letter-spacing:'+pend.letterSpacing);
    const esc=e.data.replace(/&/g,'&amp;').replace(/</g,'&lt;');
    document.execCommand('insertHTML',false,'<span style="'+st.join(';')+'">'+esc+'</span>');
    saveText();
  });
});
$('cvBtnEdit').onclick=()=>$('cvPanel').classList.toggle('on');
$('cvBtnHide').onclick=()=>{$('cvPanel').classList.remove('on');try{localStorage.setItem('yq_cover_panel_closed','1')}catch(e){}};
$('cvBtnReset').onclick=()=>{localStorage.removeItem(LSK);localStorage.removeItem(LSK+'_text');location.reload();};
$('cvBtnExport').onclick=()=>{
  $('cvPanel').classList.remove('on');
  const html='<!DOCTYPE html>\n'+document.documentElement.outerHTML;
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([html],{type:'text/html;charset=utf-8'}));
  a.download='授课封面_玉泉桥牌_定制版.html';
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
};
})();
</script>
</body></html>
