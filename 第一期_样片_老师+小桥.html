<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:#0c1410;font-family:'Microsoft YaHei',Arial,sans-serif;display:flex;justify-content:center;align-items:flex-start;min-height:100vh;padding:14px;}
  .stage{width:392px;max-width:100%;background:#0c1e26;border-radius:18px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.5);border:1px solid #16404f;}
  .topbar{background:linear-gradient(90deg,#0d3340,#15586A);padding:10px 14px;display:flex;align-items:center;justify-content:space-between;}
  .topbar .t{color:#F4E9C1;font-weight:bold;font-size:15px;}
  .badge{background:#D4A017;color:#1b2e1c;font-size:10px;font-weight:bold;padding:3px 8px;border-radius:10px;}
  .tablewrap{padding:10px 10px 4px;background:#091820;}
  svg .card{transition:filter .25s;}
  svg .card.hl{filter:url(#glow);}
  svg .card.bad{filter:url(#badg);}
  .panel{display:flex;align-items:flex-end;gap:8px;padding:8px 12px 4px;background:#0b1c24;}
  .mascot{width:74px;height:84px;flex:0 0 auto;animation:float 2.6s ease-in-out infinite;}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
  .bubble{flex:1;background:#fff;color:#1E293B;border-radius:14px;padding:9px 12px;font-size:13px;line-height:1.5;position:relative;min-height:46px;}
  .bubble:before{content:"";position:absolute;left:-8px;bottom:14px;border:8px solid transparent;border-right-color:#fff;border-left:0;}
  .bubble .sp{display:inline-block;font-size:11px;font-weight:bold;color:#028090;margin-bottom:3px;}
  .caption{padding:6px 14px 2px;color:#cfe;font-size:13px;line-height:1.55;min-height:42px;background:#0b1c24;}
  .caption .sp{color:#02C39A;font-weight:bold;margin-right:6px;}
  .ctrl{display:flex;gap:8px;padding:8px 14px 14px;background:#0b1c24;}
  .ctrl button{flex:1;background:#D4A017;color:#1b2e1c;border:0;border-radius:10px;padding:10px;font-size:14px;font-weight:bold;cursor:pointer;}
  .ctrl button.alt{background:#1b3a28;color:#cfe;border:1px solid #2c5a3c;}
  .ctrl button:active{transform:translateY(1px);}
  .hint{padding:0 14px 12px;color:#6f8f7c;font-size:10px;background:#0b1c24;}
</style></head>

<script>
const scenes=[
 {sp:'qiao', t:'老师老师！手里没有黑桃，是不是就能随便垫张红心呀？', act:'point_east'},
 {sp:'teacher', t:'不能哦小桥。有这门花色就必须跟，没有才能垫牌或将吃——这叫“跟牌义务”。', act:'none'},
 {sp:'qiao', t:'那……南家引黑桃，我该咋跟？', act:'point_south'},
 {sp:'teacher', t:'看：南引♠7 → 西跟♠3 → 北出♠K → 东没黑桃，才能垫红心♥5。', act:'demo'},
 {sp:'qiao', t:'可是……我手里其实还有张♠9，我偷偷垫了♥5，行不？', act:'wrong'},
 {sp:'teacher', t:'那叫“藏牌”，是违规！被发现后本墩判给对方，之后赢的墩还要再让一墩。', act:'wrong'},
 {sp:'qiao', t:'哦懂了！那正确做法是？', act:'none'},
 {sp:'teacher', t:'有黑桃就必须出♠9跟牌；只有真没黑桃，才能垫♥5或将吃。', act:'correct'},
 {sp:'qiao', t:'有花必跟，无花才垫；打错早改，藏牌重罚！', act:'none'},
];
const capSp=document.getElementById('capSp'), capText=document.getElementById('capText');
const bsp=document.getElementById('bsp'), btext=document.getElementById('btext');
let idx=0, playing=false, sceneToken=0, advanceTimer=null;
const $=id=>document.getElementById(id);
function clearHi(){document.querySelectorAll('.card').forEach(c=>c.classList.remove('hl','bad'));$('e9').style.opacity='0';$('stamp').style.opacity='0';}
function hl(ids){ids.forEach(id=>$(id).classList.add('hl'));}
function doAction(act){
  if(act==='point_east') hl(['e5','eq']);
  else if(act==='point_south') hl(['s7']);
  else if(act==='demo'){['s7','w3','nk','e5'].forEach((id,k)=>setTimeout(()=>{if(playing)$(id).classList.add('hl');},450*(k+1)));}
  else if(act==='wrong'){$('e9').style.opacity='1';$('stamp').style.opacity='1';$('e9').classList.add('bad');}
  else if(act==='correct'){$('e9').classList.remove('bad');$('e9').classList.add('hl');}
}
function pickVoice(){const vs=speechSynthesis.getVoices();return vs.find(v=>v.lang&&v.lang.toLowerCase().startsWith('zh'))||null;}
function speak(text,sp){
  if(!('speechSynthesis' in window))return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  const v=pickVoice(); if(v)u.voice=v;
  u.lang='zh-CN'; u.rate=sp==='qiao'?1.05:1.0; u.pitch=sp==='qiao'?1.5:1.0;
  const my=sceneToken;
  u.onend=()=>{if(my!==sceneToken)return; if(playing)next();};
  speechSynthesis.speak(u);
  const dur=Math.max(2600,text.length*230+1300);
  advanceTimer=setTimeout(()=>{if(my!==sceneToken)return; if(playing)next();},dur);
}
function show(i){
  clearHi();
  const s=scenes[i], my=++sceneToken;
  capSp.textContent=s.sp==='qiao'?'小桥：':'老师（画外）：';
  capText.textContent=s.t;
  bsp.textContent=s.sp==='qiao'?'小桥':'老师';
  btext.textContent=s.t;
  doAction(s.act);
  speak(s.t,s.sp);
}
function next(){idx++; if(idx>=scenes.length){stop();capText.textContent='—— 样片结束，换真人声即可成片 ——';btext.textContent='这一期就到这儿啦～';return;} show(idx);}
function play(){if(playing)return; playing=true; if(idx>=scenes.length)idx=0; show(idx);}
function pause(){playing=false; speechSynthesis.cancel(); if(advanceTimer)clearTimeout(advanceTimer);}
function stop(){playing=false; speechSynthesis.cancel(); if(advanceTimer)clearTimeout(advanceTimer); idx=0; clearHi(); capSp.textContent=''; capText.textContent='点击“播放样片”开始'; bsp.textContent='小桥'; btext.textContent='点“播放样片”开始，听听咱俩怎么讲这条规则～';}
document.getElementById('playBtn').onclick=play;
document.getElementById('pauseBtn').onclick=pause;
document.getElementById('replayBtn').onclick=()=>{pause();idx=0;play();};
if('speechSynthesis' in window) speechSynthesis.onvoiceschanged=()=>{};
</script>
